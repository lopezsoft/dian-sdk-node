name: CD — Release & Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Crear GitHub Release y Publicar en NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22.x y Registro NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Compilar y ejecutar suite de pruebas
        run: |
          npm run build
          npm test

      - name: Crear GitHub Release oficial
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publicar paquete en NPM Registry (con Provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice title=NPM_TOKEN no configurado::Se omite la publicación automática en npmjs.com. Configura el secret NPM_TOKEN en el repositorio de GitHub para habilitarla."
            exit 0
          fi
          npm publish --provenance --access public
