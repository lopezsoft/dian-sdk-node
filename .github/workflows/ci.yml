name: CI — Build & Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validar Compilación, Seguridad y Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Auditoría de seguridad de dependencias
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar compilación TypeScript
        run: npm run build

      - name: Ejecutar suite completa de pruebas unitarias y E2E
        run: npm test

      - name: Validar artefacto de empaquetado NPM (dry-run)
        run: npm pack --dry-run
